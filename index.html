<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Pewen Córdoba</title>
<meta name="description" content="Stock disponible del depósito de Córdoba — Pewen Pisos y Revestimientos">
<style>
  :root{
    --negro:#131110; --negro2:#241f1a; --oro:#f6b446; --oro2:#fbb748; --oro-dark:#b7791a;
    --bg:#f4f1ec; --card:#ffffff; --txt:#211f1b; --muted:#7a746a;
    --linea:#e8e3da; --ok:#2f8f4e; --bajo:#c9772a; --cero:#c0392b;
    --sombra:0 2px 12px rgba(20,15,10,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{position:sticky;top:0;z-index:20;background:var(--negro);color:#fff;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom,0));box-shadow:0 2px 14px rgba(0,0,0,.25);
    border-bottom:3px solid var(--oro)}
  .top{display:flex;align-items:center;gap:11px}
  /* Isotipo Pewen: los tres rombos. El tercero va en blanco (en la marca es
     negro) porque acá el fondo es oscuro y si no, no se vería. */
  .logo{height:26px;width:auto;display:block;flex:0 0 auto}
  @media(min-width:520px){ .logo{height:32px} }
  .brand{flex:1;line-height:1}
  .brand .t1{font-size:18px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
  .brand .t1 b{color:var(--oro);font-weight:800}
  .brand .t2{font-size:9.5px;letter-spacing:1.3px;text-transform:uppercase;color:rgba(255,255,255,.55);
    margin-top:2px;white-space:nowrap}
  .brand .t2 b{color:var(--oro);font-weight:800}   /* CÓRDOBA destacado: el stock es de acá */
  .rightbox{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:0 0 auto}
  .estado{font-size:10.5px;color:rgba(255,255,255,.7);text-align:right;white-space:nowrap}
  /* cuántos consultaron el stock hoy: discreto, al lado del estado */
  .uso{font-size:10.5px;color:rgba(255,255,255,.5);white-space:nowrap;display:none}
  .uso.on{display:block}
  .btn-ref{background:var(--oro);border:0;color:var(--negro);border-radius:8px;
    padding:7px 11px;font-size:12px;font-weight:700;cursor:pointer;flex:0 0 auto;white-space:nowrap}
  .btn-ref:active{transform:scale(.96)}
  .controls{max-width:900px;margin:0 auto;padding:10px 0 4px}
  .row{display:flex;gap:8px;margin-top:10px}
  .row input{flex:1;min-width:0;width:100%;border:1px solid rgba(255,255,255,.22);
    background:rgba(255,255,255,.10);color:#fff;border-radius:10px;padding:12px 12px;
    font-size:16px}   /* 16px: menos de eso, iOS hace zoom al tocar el campo */
  .row input::placeholder{color:rgba(255,255,255,.6)}
  .row input:focus{outline:none;border-color:var(--oro);background:rgba(255,255,255,.16)}
  .buscawrap{flex:1;min-width:0;position:relative;display:flex}
  .limpiar{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.18);
    border:0;color:#fff;width:30px;height:30px;border-radius:50%;font-size:17px;line-height:1;
    cursor:pointer;display:none}
  .limpiar.on{display:block}
  /* en pantalla chica el buscador manda: el m² se achica y el botón queda solo con la lupa */
  .m2wrap{flex:0 0 92px;position:relative;display:flex}
  .m2wrap input{padding-right:28px}
  .m2wrap span{position:absolute;right:9px;top:50%;transform:translateY(-50%);
    font-size:12.5px;color:rgba(255,255,255,.7);pointer-events:none}
  .btn-buscar{flex:0 0 auto;background:var(--oro);border:0;color:var(--negro);border-radius:10px;
    padding:0 14px;min-height:46px;font-size:15px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;gap:6px}
  .btn-buscar:active{transform:scale(.96)}
  .btn-buscar .txt{display:none}
  @media(min-width:520px){
    .m2wrap{flex:0 0 128px}
    .btn-buscar .txt{display:inline}
  }
  /* aviso de filtro activo */
  .filtro{display:none;align-items:center;gap:8px;margin:10px 4px 0;padding:9px 12px;
    background:rgba(246,180,70,.14);border:1px solid rgba(246,180,70,.4);border-radius:10px}
  .filtro.on{display:flex}
  .filtro span{flex:1;color:#fff;font-size:13px;line-height:1.3}
  .filtro span b{color:var(--oro)}
  .filtro button{background:rgba(255,255,255,.16);border:0;color:#fff;font-size:12px;font-weight:700;
    padding:7px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .chips{display:flex;gap:7px;overflow-x:auto;padding:11px 0 2px;-webkit-overflow-scrolling:touch}
  .chip{white-space:nowrap;border:0;border-radius:999px;padding:11px 15px;font-size:13.5px;font-weight:600;
    background:rgba(255,255,255,.12);color:#fff;cursor:pointer;min-height:42px}
  .chip.active{background:var(--oro);color:var(--negro);font-weight:800}
  .chip.cero{opacity:.38}                 /* sin resultados con el filtro puesto */
  .chip.cero.active{opacity:.75}
  /* En la PC el encabezado se comía un tercio de la pantalla: los tamaños están
     pensados para el dedo (inputs de 16px o iOS hace zoom, botones de 42px).
     Con mouse eso no hace falta, así que acá se achica todo. La condición pide
     hover+pointer:fine a propósito: una tablet grande sigue siendo táctil y
     tiene que conservar los tamaños de arriba. */
  @media (min-width:900px) and (hover:hover) and (pointer:fine){
    header{padding:0 14px}
    .controls{padding:7px 0 3px}
    .logo{height:24px}
    .brand .t1{font-size:15.5px;letter-spacing:1.2px}
    .brand .t2{font-size:8.5px}
    .top{gap:9px}
    .rightbox{gap:3px}
    .estado,.uso{font-size:10px}
    .btn-ref{padding:5px 9px;font-size:11.5px}
    .row{margin-top:7px;gap:7px}
    .row input{padding:8px 11px;font-size:13.5px;border-radius:9px}
    .btn-buscar{min-height:36px;padding:0 13px;font-size:13.5px;border-radius:9px}
    .limpiar{width:24px;height:24px;font-size:15px}
    /* las solapas no entran en una línea (1147px en 900): que bajen en vez de
       aparecer una barra de scroll que esconde la mitad */
    .chips{flex-wrap:wrap;overflow-x:visible;gap:6px;padding:8px 0 1px}
    .chip{padding:5px 12px;font-size:12.5px;min-height:30px}
    .filtro{margin-top:7px;padding:6px 11px}
    .filtro span{font-size:12.5px}
    .filtro button{padding:5px 9px}
  }
  main{max-width:900px;margin:0 auto;padding:14px 12px 60px}
  .hint{color:var(--muted);font-size:13px;margin:2px 4px 10px}
  .grid{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
  /* En una pantalla de PC sobraban ~400px a los costados: se ensancha el
     contenedor y entra una tercera columna. De paso las solapas vuelven a
     entrar en una sola línea, así que el encabezado baja otro poco. */
  @media(min-width:1100px){
    main,.controls{max-width:1240px}
    .grid{grid-template-columns:1fr 1fr 1fr}
  }
  .card{background:var(--card);border:1px solid var(--linea);border-radius:14px;overflow:hidden;
    box-shadow:var(--sombra);display:flex;flex-direction:column;transition:box-shadow .15s}
  .card:hover{box-shadow:0 6px 20px rgba(20,15,10,.12)}
  /* Cartel grande arriba de la tarjeta (no encima de la foto, para no pisar el
     catlabel/masfotos que ya viven ahí): altas y reposiciones recientes. Se
     apaga solo pasados MOVIMIENTOS_DIAS (ver Codigo.gs), no hay que sacarlo a mano. */
  .cartel-mov{padding:8px 12px;font-size:12.5px;font-weight:900;letter-spacing:.4px;
    text-align:center;text-transform:uppercase;color:#fff}
  .cartel-mov.nuevo{background:var(--oro-dark)}
  .cartel-mov.reingreso{background:var(--ok)}
  .ph{position:relative;background:#efeae1;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
  .ph .noimg{color:#b7ae9e;font-size:13px;text-align:center;padding:0 10px}
  .phlink{text-decoration:none;cursor:pointer}
  .phlink:hover img{transform:scale(1.04)}
  /* Botones sobre la foto: son para tocar con el dedo, no etiquetas. */
  /* Va abajo de todo, fuera de la foto: encima de la imagen se lo tocaba sin
     querer al intentar abrir la galería. */
  .verweb{margin-top:7px;width:100%;background:#f3efe7;color:var(--oro-dark);border:1px solid var(--linea);
    font-size:13px;font-weight:800;padding:10px;border-radius:9px;letter-spacing:.2px;
    min-height:42px;display:flex;align-items:center;justify-content:center;gap:5px;
    text-decoration:none;cursor:pointer}
  .verweb:active{transform:scale(.98)}
  /* Subir foto: mismo lugar y tamaño que "Ver en la web" (abajo del todo, no
     encima de la foto — ver el comentario de .verweb) pero con borde dorado
     para diferenciarlo del link a la web. */
  .btn-foto{margin-top:7px;width:100%;background:#fff;color:var(--oro-dark);border:1.5px solid var(--oro);
    font-size:13px;font-weight:800;padding:9px;border-radius:9px;letter-spacing:.2px;
    min-height:42px;display:flex;align-items:center;justify-content:center;gap:5px;cursor:pointer}
  .btn-foto:active{transform:scale(.98)}
  .btn-foto:disabled{opacity:.6}
  .subidapor{position:absolute;left:8px;bottom:9px;background:rgba(47,143,78,.92);color:#fff;
    font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:6px}
  .catlabel{position:absolute;top:8px;left:8px;background:var(--oro);color:var(--negro);
    font-size:10.5px;font-weight:800;letter-spacing:.4px;padding:4px 8px;border-radius:6px;text-transform:uppercase}
  .body{padding:11px 12px 12px}
  .nombre{font-size:15.5px;font-weight:800;line-height:1.2;margin:0 0 3px}
  .sub{font-size:12px;color:var(--muted);margin-bottom:9px}
  .stock{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .pill{font-size:12px;font-weight:700;padding:5px 9px;border-radius:8px;background:#f0ede6}
  .pill.m2{background:#fbeecb;color:var(--oro-dark)}
  .pill.cajas{background:#efece6;color:#5c5648}
  .pill.mm{background:#eef0f2;color:#4a5560}
  .estado-stock{font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:8px}
  .s-ok{background:#e7f5ec;color:var(--ok)} .s-bajo{background:#fbeede;color:var(--bajo)}
  .s-cero{background:#fbe6e3;color:var(--cero)}
  .alcanza{font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:8px;background:#e7f5ec;color:var(--ok)}
  .no-alcanza{background:#fbe6e3;color:var(--cero)}
  .copiar{width:100%;border:0;background:var(--negro);color:var(--oro);padding:13px 10px;border-radius:9px;
    font-size:13.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;
    gap:6px;min-height:46px}
  .copiar:active{transform:scale(.98)} .copiar.done{background:var(--oro);color:var(--negro)}
  .vacio{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px}
  .loader{text-align:center;color:var(--muted);padding:50px 20px}
  .setup{max-width:620px;margin:40px auto;background:#fff;border:1px solid var(--linea);
    border-radius:14px;padding:22px;box-shadow:var(--sombra)}
  .setup h2{margin:0 0 8px;color:var(--negro)} .setup code{background:#f0ede6;padding:2px 6px;border-radius:5px;font-size:13px}
  .setup input{width:100%;padding:11px;border:1px solid var(--linea);border-radius:9px;margin:10px 0;font-size:14px}
  .setup button{background:var(--oro);color:var(--negro);border:0;padding:11px 16px;border-radius:9px;font-weight:800;cursor:pointer}
  .count{font-size:12px;color:var(--muted);margin:0 4px 8px}
  .grupo{font-size:13px;font-weight:800;letter-spacing:.6px;text-transform:uppercase;color:var(--negro);
    margin:20px 4px 10px;padding-bottom:6px;border-bottom:2px solid var(--oro)}
  .grupo:first-child{margin-top:2px}
  /* galería: contador de fotos + visor. El cartel es solo indicación: el que
     abre el visor es el click en toda la foto. */
  .masfotos{position:absolute;bottom:9px;left:9px;background:rgba(19,17,16,.88);color:#fff;
    font-size:13px;font-weight:800;padding:0 14px;border-radius:9px;letter-spacing:.3px;
    border:0;cursor:pointer;min-height:40px;display:inline-flex;align-items:center;gap:5px;
    pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .phlink:active .masfotos{transform:scale(.95)}
  /* carrete: una foto por vez, completa, se desliza con el dedo */
  .visor{position:fixed;inset:0;z-index:50;background:rgba(12,10,9,.97);display:none;flex-direction:column}
  .visor.abierto{display:flex}
  .visor-top{display:flex;align-items:center;gap:10px;color:#fff;flex:0 0 auto;
    padding:12px 14px calc(12px) 14px}
  .visor-top b{font-size:15px;flex:1;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .contador{font-size:13px;font-weight:700;color:var(--oro);flex:0 0 auto;
    background:rgba(255,255,255,.10);padding:5px 10px;border-radius:999px}
  .visor-cerrar{background:rgba(255,255,255,.15);border:0;color:#fff;font-size:22px;line-height:1;
    width:38px;height:38px;border-radius:10px;cursor:pointer;flex:0 0 auto}
  .carrete{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;scrollbar-width:none;min-height:0}
  .carrete::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;
    display:flex;align-items:center;justify-content:center;padding:0 10px}
  .slide img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;
    border-radius:10px;display:block}
  .visor-bot{flex:0 0 auto;display:flex;align-items:center;gap:10px;
    padding:12px 14px calc(14px + env(safe-area-inset-bottom,0))}
  .flecha{background:rgba(255,255,255,.14);border:0;color:#fff;font-size:24px;line-height:1;
    width:44px;height:44px;border-radius:12px;cursor:pointer;flex:0 0 auto}
  .flecha:disabled{opacity:.25}
  .vcopiar{flex:1.4;background:var(--oro);border:0;color:var(--negro);
    font-size:14px;font-weight:800;padding:13px 10px;border-radius:12px;cursor:pointer;min-height:46px}
  .vcopiar:active{transform:scale(.97)}
  .vcopiar:disabled{opacity:.75}
  .vcopiar.listo{background:#2f8f4e;color:#fff}
  .vdesc{flex:1;text-align:center;background:rgba(255,255,255,.16);color:#fff;text-decoration:none;
    font-size:13.5px;font-weight:700;padding:13px 10px;border-radius:12px}
  .vpie{text-align:center;color:rgba(255,255,255,.5);font-size:11.5px;padding:0 14px 2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 0 auto}
  /* Solo aparece en fotos subidas por el equipo (no en las de la web/Drive del
     catálogo): son las únicas que se pueden sacar desde acá. */
  .vquitar{display:none;margin:0 14px 6px;background:none;border:0;color:#e29a8a;
    font-size:12.5px;font-weight:700;padding:6px;cursor:pointer;flex:0 0 auto}
  .vquitar.on{display:block}
  /* z-index por encima del visor (50): el aviso de "subiendo foto…" tiene que
     verse aunque el visor esté abierto. */
  .toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--negro);color:#fff;
    padding:11px 18px;border-radius:10px;font-size:13.5px;font-weight:700;box-shadow:0 4px 20px rgba(0,0,0,.3);
    z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
  .toast.on{opacity:1}
</style>
</head>
<body>
<header>
  <div class="controls">
    <div class="top">
      <svg class="logo" viewBox="0 0 146 92" role="img" aria-label="Pewen">
        <polygon points="0,34 34,0 90,56 56,92"    fill="#c9c9c9"/>
        <polygon points="44,34 78,0 134,56 100,92" fill="#f6b446"/>
        <polygon points="90,28 118,0 146,28 118,56" fill="#ffffff"/>
      </svg>
      <div class="brand">
        <div class="t1">Stock <b>Pewen</b></div>
        <div class="t2">Depósito <b>Córdoba</b></div>
      </div>
      <div class="rightbox">
        <span class="estado" id="estado">cargando…</span>
        <span class="uso" id="uso" title="Personas que consultaron el stock hoy"></span>
        <button class="btn-ref" id="refrescar">↻ Actualizar</button>
      </div>
    </div>
    <form class="row" id="formBuscar" autocomplete="off">
      <div class="buscawrap">
        <input id="buscar" type="search" inputmode="search" placeholder="Tono, código, zócalo…" autocomplete="off">
        <button type="button" class="limpiar" id="limpiar" aria-label="Borrar búsqueda">&times;</button>
      </div>
      <div class="m2wrap">
        <input id="m2" type="number" inputmode="decimal" min="0" placeholder="0">
        <span>m²</span>
      </div>
      <button type="submit" class="btn-buscar" id="btnBuscar" aria-label="Buscar">🔍<span class="txt">Buscar</span></button>
    </form>
    <div class="chips" id="chips"></div>
    <div class="filtro" id="filtro">
      <span id="filtroTxt"></span>
      <button type="button" id="filtroBorrar">Borrar</button>
    </div>
  </div>
</header>

<main>
  <div id="setup" class="setup" style="display:none">
    <h2>Falta un paso</h2>
    <p>Pegá la URL del Web App de Apps Script (la que termina en <code>/exec</code>) para conectar el stock. Queda guardada en este dispositivo.</p>
    <input id="setupUrl" placeholder="https://script.google.com/macros/s/AKfyc.../exec">
    <button id="setupSave">Conectar</button>
  </div>

  <p class="hint" id="hint"></p>
  <p class="count" id="count"></p>
  <div id="lista"></div>
</main>

<div class="visor" id="visor">
  <div class="visor-top">
    <b id="visorTit"></b>
    <span class="contador" id="visorCont"></span>
    <button class="visor-cerrar" id="visorCerrar" aria-label="Cerrar">&times;</button>
  </div>
  <div class="carrete" id="carrete"></div>
  <div class="vpie" id="visorPie"></div>
  <button class="vquitar" id="visorQuitar">🗑 Sacar esta foto (la subió el equipo)</button>
  <div class="visor-bot">
    <button class="flecha" id="visorPrev" aria-label="Anterior">&lsaquo;</button>
    <button class="vcopiar" id="visorCopiar">📋 Copiar foto</button>
    <a class="vdesc" id="visorDesc" href="#" target="_blank" rel="noopener" download>Descargar</a>
    <button class="flecha" id="visorNext" aria-label="Siguiente">&rsaquo;</button>
  </div>
</div>
<input type="file" id="fotoInput" accept="image/*" multiple style="display:none">
<div class="toast" id="toast"></div>

<script>
// ====== CONFIG ======
// URL del Web App (termina en /exec). Ya conectada al stock de Pewen.
var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw9bYvlWTbq8h736zhANFcbV5ALWkCT6CW6iwj7ymfcFNXtiNnRnbCsjFzgHBdMxdJh/exec";

// Se toca en CADA cambio de este archivo (cualquier valor distinto sirve).
// La sirve para que el celu de cada vendedor se autoactualice solo -- ver
// revisarActualizacion() más abajo. Si no se toca acá, un cambio nuevo
// publicado en GitHub Pages puede quedar invisible para el que ya tenía la
// pestaña abierta.
var APP_BUILD = "2026-09-21c";

// Orden preferido y etiquetas. Los chips se arman según qué categorías haya en el stock.
// Orden de las solapas: es el que pidió Nicolás, por cómo se venden.
var CAT_ORDER = ['flotante','vinilico','porcelanato','revestimiento','deck','accesorio'];
var CAT_LABEL = {flotante:'Piso flotante',vinilico:'Piso vinílico',deck:'Deck',
  revestimiento:'Revestimiento',porcelanato:'Porcelanato',accesorio:'Accesorios'};
var CAT_SHORT = {flotante:'Flotante',vinilico:'Vinílico',deck:'Deck',
  revestimiento:'Revestimiento',porcelanato:'Porcelanato',accesorio:'Accesorio'};

var state = { productos:[], accesorios:[], cat:'todos', q:'', m2:null, actualizado:null, uso:null };

// Los accesorios se muestran en tres solapas: los adhesivos no tienen nada que
// ver con zócalos ni varillas y el vendedor los busca por separado.
var ACC_FAMS = [
  {id:'zocalos',  label:'Zócalos'},
  {id:'varillas', label:'Varillas'},
  {id:'adhesivos',label:'Adhesivos'}
];
function famAcc(a){
  var t=(a.tipo||'').toUpperCase();
  if(t.indexOf('VARILLA')===0) return 'varillas';
  if(/ADHESIV|SILICONA|MANTO|MASA|FIELTRO/.test(t)) return 'adhesivos';
  return 'zocalos';
}
function esChipAcc(id){
  for(var i=0;i<ACC_FAMS.length;i++) if(ACC_FAMS[i].id===id) return true;
  return false;
}
// Texto sobre el que busca el buscador de accesorios.
function textoAcc(a){
  return (a.tono+' '+a.tipo+' '+(a.unidad||'')).toLowerCase();
}
function textoProd(p){
  return (p.nombre+' '+p.tipo+' '+p.codigo+' '+(p.sku||'')+' '+(CAT_LABEL[p.categoria]||'')).toLowerCase();
}

// Cuántos hay en cada solapa CON los filtros puestos, para que los números de
// los chips digan cuántos alcanzan y no el total del catálogo.
function cuentasPorChip(){
  var c={};
  state.productos.forEach(function(p){
    if(state.m2!=null && (p.m2==null || p.m2 < state.m2)) return;
    if(state.q && textoProd(p).indexOf(state.q)<0) return;
    c[p.categoria]=(c[p.categoria]||0)+1;
  });
  // el filtro de m² no aplica a los accesorios: se cuentan solo por texto
  state.accesorios.forEach(function(a){
    if(state.q && textoAcc(a).indexOf(state.q)<0) return;
    var f=famAcc(a); c[f]=(c[f]||0)+1;
  });
  return c;
}

function getUrl(){ return SCRIPT_URL || localStorage.getItem('stock_url') || ''; }

// ====== AUTOACTUALIZACIÓN ======
// El celu de un vendedor suele quedar con esta pestaña abierta días enteros
// (se cambia a WhatsApp para mandar el mensaje y se vuelve, nunca la cierra
// del todo) -- así nunca vuelve a pedir este archivo y se queda con el código
// viejo aunque yo publique uno nuevo. Cada vez que la pestaña cambia de
// visible a oculta (o viceversa: se manda el WhatsApp y se vuelve) se
// rechequea en silencio si hay una versión más nueva; si la hay, se recarga
// sola. También se revisa cada 15 min por si a alguien le queda la pestaña
// al frente todo el día sin cambiar de app. Nadie tiene que enterarse ni
// tocar nada -- si no hay nada nuevo, no pasa nada.
function revisarActualizacion(){
  fetch(location.pathname + '?build=' + Date.now(), {cache:'no-store'})
    .then(function(r){ return r.text(); })
    .then(function(html){
      var m = html.match(/APP_BUILD\s*=\s*"([^"]+)"/);
      if(m && m[1] && m[1]!==APP_BUILD) location.reload();
    })
    .catch(function(){});   // sin conexión o falló: sigue con lo que tiene, no rompe nada
}

// ====== USO (anónimo) ======
// Sirve para saber si la app se usa o no. Este número se genera al azar en el
// teléfono y no está atado a ninguna persona: no se manda nombre ni nada que
// permita identificar a quién la abrió.
function idAparato(){
  var id=localStorage.getItem('ap_id');
  if(!id){
    id=Math.random().toString(36).slice(2,10);
    localStorage.setItem('ap_id',id);
  }
  return id;
}
// Cuántas veces se abrió hoy en este teléfono.
function contarApertura(){
  var hoy=new Date().toISOString().slice(0,10);
  var u={};
  try{ u=JSON.parse(localStorage.getItem('ap_uso')||'{}'); }catch(e){}
  if(u.fecha!==hoy) u={fecha:hoy, veces:0};
  u.veces++;
  localStorage.setItem('ap_uso',JSON.stringify(u));
  return u.veces;
}

function init(){
  renderChips();
  document.getElementById('buscar').addEventListener('input', function(e){
    state.q=e.target.value.trim().toLowerCase();
    document.getElementById('limpiar').classList.toggle('on', !!e.target.value);
    render();
  });
  document.getElementById('m2').addEventListener('input', function(e){ var v=parseFloat(e.target.value); state.m2=isNaN(v)||v<=0?null:v; render(); });

  // El botón Buscar (y la tecla Enter) cierran el teclado del celular y llevan
  // la vista a los resultados. El filtrado ya ocurre mientras se escribe: esto
  // es para que quede claro que la búsqueda se aplicó.
  document.getElementById('formBuscar').addEventListener('submit', function(e){
    e.preventDefault();
    document.getElementById('buscar').blur();
    document.getElementById('m2').blur();
    render();
    var l=document.getElementById('lista');
    if(l) window.scrollTo({top:Math.max(0,l.offsetTop-70), behavior:'smooth'});
  });
  document.getElementById('limpiar').addEventListener('click', limpiarBusqueda);
  document.getElementById('filtroBorrar').addEventListener('click', function(){
    limpiarBusqueda();
    document.getElementById('m2').value=''; state.m2=null;
    render();
  });
  document.getElementById('refrescar').addEventListener('click', function(){ cargar(true); });
  document.getElementById('visorCerrar').addEventListener('click', cerrarVisor);
  document.getElementById('visor').addEventListener('click', function(e){
    if(e.target===this) cerrarVisor();          // tocar el fondo cierra
  });
  document.getElementById('visorCopiar').addEventListener('click', function(){ copiarFoto(this); });
  document.getElementById('visorPrev').addEventListener('click', function(){ irAFoto(_verPos-1); });
  document.getElementById('visorNext').addEventListener('click', function(){ irAFoto(_verPos+1); });
  document.getElementById('visorQuitar').addEventListener('click', function(){
    var f=_verFotos[_verPos];
    if(!f || f.o!=='equipo' || !_verId) return;
    if(!confirm('¿Sacar esta foto? La subió alguien del equipo — si está de más, repetida o mal, se puede sacar. No se puede deshacer desde acá.')) return;
    fetch(getUrl(), {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({accion:'ocultar_foto_equipo', id:_verId, url:f.u})
    }).catch(function(){});
    _verFotos.splice(_verPos,1);
    toast('Foto sacada.');
    if(!_verFotos.length){ cerrarVisor(); }
    else { _verPos=Math.min(_verPos,_verFotos.length-1); pintarCarrete(); actualizarVisor(); }
    setTimeout(function(){ cargar(true); }, 1200);
  });
  document.getElementById('fotoInput').addEventListener('change', function(e){
    // hay que copiar los archivos ANTES de limpiar el input: en varios navegadores
    // e.target.files se vacía sola apenas se pisa e.target.value.
    var lista = Array.prototype.slice.call(e.target.files || []);
    e.target.value = '';
    if(lista.length && pendienteFoto) subirFoto(pendienteFoto, lista);
  });
  // al deslizar con el dedo, el contador sigue a la foto que quedó centrada
  var _t=null;
  document.getElementById('carrete').addEventListener('scroll', function(){
    var c=this;
    clearTimeout(_t);
    _t=setTimeout(function(){
      var n=Math.round(c.scrollLeft/c.clientWidth);
      if(n!==_verPos){ _verPos=n; actualizarVisor(); }
    },80);
  });
  document.addEventListener('keydown', function(e){
    if(!document.getElementById('visor').classList.contains('abierto')) return;
    if(e.key==='Escape') cerrarVisor();
    if(e.key==='ArrowLeft') irAFoto(_verPos-1);
    if(e.key==='ArrowRight') irAFoto(_verPos+1);
  });
  document.getElementById('setupSave').addEventListener('click', function(){
    var u=document.getElementById('setupUrl').value.trim();
    if(!/\/exec$/.test(u)){ alert('La URL tiene que terminar en /exec'); return; }
    localStorage.setItem('stock_url', u); document.getElementById('setup').style.display='none'; cargar(true);
  });

  document.addEventListener('visibilitychange', revisarActualizacion);
  setInterval(revisarActualizacion, 15*60*1000);

  if(!getUrl()){ document.getElementById('setup').style.display='block'; document.getElementById('estado').textContent=''; return; }
  // mostrar cache guardado al toque, y refrescar en segundo plano
  var cache = localStorage.getItem('stock_cache');
  if(cache){ try{ var c=JSON.parse(cache); state.productos=c.productos; state.accesorios=c.accesorios||[]; state.actualizado=c.actualizado; render(); setEstado(); }catch(e){} }
  cargar(false);
}

function cargar(force){
  var url=getUrl(); if(!url) return;
  document.getElementById('estado').textContent='actualizando…';
  // el conteo anónimo viaja en la misma llamada que ya trae el stock
  var q = (force?'?refresh=1&':'?') + 'd=' + idAparato() + '&n=' + contarApertura();
  fetch(url + q, {method:'GET'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.ok) throw new Error(d.error||'error');
      state.productos=d.productos; state.accesorios=d.accesorios||[]; state.actualizado=d.actualizado;
      state.uso=d.uso||null;
      localStorage.setItem('stock_cache', JSON.stringify({productos:d.productos, accesorios:d.accesorios||[], actualizado:d.actualizado}));
      render(); setEstado(); pintarUso();
    })
    .catch(function(err){
      document.getElementById('estado').textContent='sin conexión';
      if(!state.productos.length){
        document.getElementById('lista').innerHTML='<div class="vacio">No se pudo cargar el stock.<br>Revisá la conexión o tocá ↻ Actualizar.<br><small>'+String(err.message||err)+'</small></div>';
      }
    });
}

function limpiarBusqueda(){
  var i=document.getElementById('buscar');
  i.value=''; state.q='';
  document.getElementById('limpiar').classList.remove('on');
  render();
}

// Muestra arriba qué se está filtrando, para que no queden resultados
// escondidos por una búsqueda vieja que quedó puesta.
function pintarFiltro(n){
  var partes=[];
  if(state.q) partes.push('<b>'+esc(state.q)+'</b>');
  if(state.m2!=null) partes.push('desde <b>'+state.m2+' m²</b>');
  var f=document.getElementById('filtro');
  if(!partes.length){ f.classList.remove('on'); return; }
  document.getElementById('filtroTxt').innerHTML =
    'Buscando '+partes.join(' · ')+' — '+n+' resultado'+(n===1?'':'s');
  f.classList.add('on');
}

// Cuántos consultaron el stock hoy. Es un número, sin nombres: sirve para saber
// si la app se está usando sin tener que abrir ninguna planilla.
function pintarUso(){
  var el=document.getElementById('uso');
  var u=state.uso;
  if(!u || !u.aparatos){ el.classList.remove('on'); return; }
  el.textContent = '👤 '+u.aparatos+' hoy'+(u.aperturas>u.aparatos?(' · '+u.aperturas+' consultas'):'');
  el.classList.add('on');
}

function setEstado(){
  if(!state.actualizado){ document.getElementById('estado').textContent=''; return; }
  var d=new Date(state.actualizado); var diff=Math.round((Date.now()-d.getTime())/60000);
  var t = diff<1?'recién':(diff<60?('hace '+diff+' min'):('hace '+Math.round(diff/60)+' h'));
  document.getElementById('estado').textContent='actualizado '+t;
}

function renderChips(){
  var c=document.getElementById('chips'); c.innerHTML='';
  var presentes={}; state.productos.forEach(function(p){ presentes[p.categoria]=(presentes[p.categoria]||0)+1; });
  var lista=[{id:'todos', label:'Todos'}];
  CAT_ORDER.forEach(function(id){ if(presentes[id]) lista.push({id:id, label:CAT_LABEL[id]||id, n:presentes[id]}); });
  // accesorios: una solapa por familia (zócalos / varillas / adhesivos)
  var pf={}; state.accesorios.forEach(function(a){ var f=famAcc(a); pf[f]=(pf[f]||0)+1; });
  ACC_FAMS.forEach(function(f){ if(pf[f.id]) lista.push({id:f.id, label:f.label, n:pf[f.id]}); });
  // categorías inesperadas que no estén en el orden
  Object.keys(presentes).forEach(function(id){
    if(id!=='todos' && CAT_ORDER.indexOf(id)<0) lista.push({id:id, label:id, n:presentes[id]});
  });
  lista.forEach(function(cat){
    var b=document.createElement('button'); b.className='chip'+(cat.id===state.cat?' active':'');
    b.setAttribute('data-id', cat.id);
    b.setAttribute('data-label', cat.label);
    b.textContent=cat.label+(cat.n?(' ('+cat.n+')'):'');
    b.onclick=function(){ state.cat=cat.id; renderChips(); render(); actualizarChips(); };
    c.appendChild(b);
  });
  actualizarChips();
}

// Refresca los números de los chips según los filtros, sin volver a crearlos
// (si se recrean, se pierde la posición del desplazamiento horizontal).
function actualizarChips(){
  var cuentas=cuentasPorChip();
  var hayM2 = state.m2!=null;      // buscar por m² es cosa de pisos, no de accesorios
  var totalProd=0, totalAcc=0;
  Object.keys(cuentas).forEach(function(k){
    if(esChipAcc(k)) totalAcc+=cuentas[k]; else totalProd+=cuentas[k];
  });
  Array.prototype.forEach.call(document.querySelectorAll('.chip'), function(b){
    var id=b.getAttribute('data-id'), lab=b.getAttribute('data-label');
    if(!id) return;
    var acc=esChipAcc(id);
    if(acc && hayM2){
      // los accesorios no se venden por m²: mostramos la solapa sin número
      b.textContent = lab;
      b.classList.add('cero');
    } else {
      var n = id==='todos' ? (totalProd + (hayM2?0:totalAcc)) : (cuentas[id]||0);
      b.textContent = lab+' ('+n+')';
      b.classList.toggle('cero', n===0);
    }
    b.classList.toggle('active', id===state.cat);
  });
}

// Accesorios que cumplen la búsqueda (opcionalmente acotados a una familia).
function accFiltrados(fam){
  return state.accesorios.filter(function(a){
    if(fam && famAcc(a)!==fam) return false;
    if(state.q && textoAcc(a).indexOf(state.q)<0) return false;
    return true;
  }).sort(function(a,b){
    if(a.tipo!==b.tipo) return a.tipo.localeCompare(b.tipo,'es');
    return a.tono.localeCompare(b.tono,'es',{numeric:true});
  });
}

function filtrados(){
  if(esChipAcc(state.cat)){
    return state.accesorios.filter(function(a){
      if(famAcc(a)!==state.cat) return false;
      if(state.q && textoAcc(a).indexOf(state.q)<0) return false;
      return true;
    }).sort(function(a,b){
      if(a.tipo!==b.tipo) return a.tipo.localeCompare(b.tipo,'es');
      // numeric: para que "Nº 2" vaya antes de "Nº 10"
      return a.tono.localeCompare(b.tono,'es',{numeric:true});
    });
  }
  return state.productos.filter(function(p){
    if(state.cat!=='todos' && p.categoria!==state.cat) return false;
    if(state.m2!=null){ if(p.m2==null || p.m2 < state.m2) return false; }
    if(state.q && textoProd(p).indexOf(state.q)<0) return false;
    return true;
  }).sort(function(a,b){
    // nuevo ingreso / reingreso primero (en cualquier categoría), y recién
    // después de mayor a menor m² -- antes ordenaba solo por m²
    var ca=a.movimiento?1:0, cb=b.movimiento?1:0;
    if(ca!==cb) return cb-ca;
    return (b.m2||0)-(a.m2||0);
  });
}

var _chipsSig='';
function render(){
  var lista=document.getElementById('lista');
  var hint=document.getElementById('hint');
  if(!state.productos.length && !state.accesorios.length){ if(getUrl()) lista.innerHTML='<div class="loader">Cargando stock…</div>'; return; }

  // rebuild de chips cuando cambian las categorías presentes (ej. al llegar los datos)
  var sig=CAT_ORDER.filter(function(id){return state.productos.some(function(p){return p.categoria===id;});}).join(',');
  if(sig!==_chipsSig){ _chipsSig=sig; renderChips(); }

  var arr=filtrados();
  _galeria=[];      // se rearma en cada render junto con las tarjetas
  actualizarChips();   // los números de las solapas siguen a los filtros
  document.getElementById('count').textContent = arr.length+' resultado'+(arr.length===1?'':'s');

  // el buscador por m² solo tiene sentido en productos
  var esAcc = esChipAcc(state.cat);
  document.getElementById('m2').parentNode.style.display = esAcc ? 'none' : '';
  hint.textContent = (!esAcc && state.m2!=null)
    ? ('Tonos con al menos '+state.m2+' m² disponibles (de mayor a menor).')
    : '';

  // Buscando desde "Todos" también aparecen los accesorios que coincidan, así no
  // hace falta saber en qué solapa está lo que se busca.
  var extra = (state.cat==='todos' && state.q) ? accFiltrados(null) : [];

  pintarFiltro(arr.length+extra.length);

  if(!arr.length && !extra.length){
    lista.innerHTML='<div class="vacio">No se encontró nada'+(state.q?' con «'+esc(state.q)+'»':'')+
      '.<br>Probá con otra palabra o tocá Borrar.</div>';
    return;
  }
  if(extra.length){
    document.getElementById('count').textContent =
      arr.length+' producto'+(arr.length===1?'':'s')+' y '+extra.length+' accesorio'+(extra.length===1?'':'s');
  }

  var html='';
  if(esAcc){
    html = porGrupos(arr);
  } else {
    if(arr.length) html += '<div class="grid">'+arr.map(card).join('')+'</div>';
    if(extra.length) html += porGrupos(extra);
  }
  lista.innerHTML=html;
}

// Accesorios agrupados por tipo, con un título por grupo.
function porGrupos(arr){
  var html='', tipoActual=null;
  arr.forEach(function(a){
    if(a.tipo!==tipoActual){
      if(tipoActual!==null) html+='</div>';
      tipoActual=a.tipo;
      html+='<h3 class="grupo">'+esc(a.tipo)+'</h3><div class="grid">';
    }
    html+=cardAccesorio(a);
  });
  if(tipoActual!==null) html+='</div>';
  return html;
}

function estadoStock(p){
  var c=p.cajas;
  if(c===0) return '<span class="estado-stock s-cero">Sin stock</span>';
  if(c!=null && c<=3) return '<span class="estado-stock s-bajo">Últimas '+c+'</span>';
  return '';
}

// Cartel grande de "nuevo ingreso" / "reingreso de stock" (lo pone marcarMovimientos
// en el backend, comparando contra la corrida anterior). Sin novedad, no devuelve nada.
function cartelMovimiento(x){
  if(x.movimiento==='nuevo')     return '<div class="cartel-mov nuevo">🆕 Nuevo ingreso</div>';
  if(x.movimiento==='reingreso') return '<div class="cartel-mov reingreso">📦 Reingreso de stock</div>';
  return '';
}

function card(p){
  var cajas = p.cajas==null?'—':p.cajas;
  var m2 = p.m2==null?'—':(Math.round(p.m2*100)/100);
  var alcanza='';
  if(state.m2!=null && p.m2!=null){
    var sobra=Math.round((p.m2-state.m2)*100)/100;
    alcanza='<span class="alcanza">✓ alcanza (sobran '+sobra+' m²)</span>';
  }
  var ph = bloqueFoto(fotosDe(p), p.nombre, p.link, CAT_SHORT[p.categoria]||p.categoria, p.nombre, p.id);
  return ''
  + '<div class="card">'
  +   cartelMovimiento(p)
  +   ph
  +   '<div class="body">'
  +     '<p class="nombre">'+esc(p.nombre)+'</p>'
  +     '<p class="sub">'+esc([p.tipo,p.mm,p.codigo?('Cód. '+p.codigo):'',p.sku?('SKU '+p.sku):''].filter(Boolean).join(' · '))+'</p>'
  +     '<div class="stock">'
  +       (p.m2!=null?'<span class="pill m2">'+m2+' m²</span>':'')
  +       '<span class="pill cajas">'+cajas+' '+esc(p.unidad||'cajas')+'</span>'
  +       (p.mm?'<span class="pill mm">'+esc(p.mm)+'</span>':'')
  +       estadoStock(p)+alcanza
  +     '</div>'
  +     '<button class="copiar" onclick="copiar(this)" data-msg="'+escAttr(waMsg(p))+'">📋 Copiar para WhatsApp</button>'
  +     botonFoto(p.id, p.nombre)
  +     (p.link?'<a class="verweb" href="'+escAttr(p.link)+'" target="_blank" rel="noopener">Ver en la web ↗</a>':'')
  +   '</div>'
  + '</div>';
}

function cardAccesorio(a){
  // sin cartel de nuevo ingreso/reingreso acá: zócalos/varillas/adhesivos quedan afuera (a.movimiento nunca viene)
  var ph = bloqueFoto(fotosDe(a), a.tono+' — '+a.tipo, a.link, 'Accesorio', a.tono, a.id);
  return ''
  + '<div class="card">'
  +   ph
  +   '<div class="body">'
  +     '<p class="nombre">'+esc(a.tono)+'</p>'
  +     '<p class="sub">'+esc(a.tipo)+'</p>'
  +     '<div class="stock">'
  +       '<span class="pill cajas">'+accStock(a)+'</span>'
  +       (a.stock<=3?'<span class="estado-stock s-bajo">Últimas '+a.stock+'</span>':'')
  +     '</div>'
  +     '<button class="copiar" onclick="copiar(this)" data-msg="'+escAttr(waAccMsg(a))+'">📋 Copiar para WhatsApp</button>'
  +     botonFoto(a.id, a.tono)
  +     (a.link?'<a class="verweb" href="'+escAttr(a.link)+'" target="_blank" rel="noopener">Ver en la web ↗</a>':'')
  +   '</div>'
  + '</div>';
}

function botonFoto(id, nombre){
  return '<button class="btn-foto" onclick="pedirFoto(this)" data-id="'+escAttr(id)+'" data-nombre="'+escAttr(nombre)+'">📷 Sacar/subir foto</button>';
}

// El texto que se manda al cliente aclara la sucursal: este stock es el del
// depósito de Córdoba y no sirve para las otras.
function waMsg(p){
  var l=[];
  l.push('*'+p.nombre+'*'+(CAT_SHORT[p.categoria]?(' — '+CAT_SHORT[p.categoria]):''));
  var det=[p.tipo,p.mm].filter(Boolean).join(' · '); if(det) l.push(det);
  if(p.codigo) l.push('Código: '+p.codigo);
  if(p.sku) l.push('SKU: '+p.sku);
  // Piedra fina y demás se venden por unidad y no tienen m²: ahí va la cantidad sola.
  if(p.m2!=null) l.push('Disponible: '+(Math.round(p.m2*100)/100)+' m² ('+(p.cajas==null?'?':p.cajas)+' cajas)');
  else if(p.cajas!=null) l.push('Disponible: '+p.cajas+' '+(p.unidad||'cajas'));
  if(p.link) l.push(p.link);        // así el cliente puede ver el producto en la web
  l.push('Stock Córdoba');
  return l.join('\n');
}

// La unidad viene de la planilla ("balde/s", "Rollos", "KIT"…). Si no hay, son unidades sueltas.
function accStock(a){
  return (Math.round(a.stock*100)/100)+' '+(a.unidad||'u.');
}

// ====== GALERÍA ======
// Cada producto/accesorio trae `fotos`: la de la web primero y después las de
// Drive (varias tomas del mismo tono, incluida la de ambiente). En la tarjeta se
// ve la primera; tocarla abre el visor con TODAS, cada una con su descarga.
var _galeria = [];   // fotos de todos los items, por índice

function fotosDe(x){
  if(x.fotos && x.fotos.length) return x.fotos;
  return x.foto ? [{u:x.foto, d:x.foto, o:'web', n:''}] : [];
}

// La foto de la tarjeta abre el visor, NO la web. "Ver en la web" salió de
// encima de la foto (ocupaba 130×40 y se lo tocaba sin querer al querer ver la
// imagen) y ahora vive abajo, en el cuerpo de la tarjeta.
function bloqueFoto(fs, titulo, link, catLabel, alt, id){
  var img = fs.length
    ? '<img src="'+escAttr(fs[0].u)+'" loading="lazy" alt="'+escAttr(alt)+'" onerror="this.parentNode.innerHTML=\'<div class=noimg>Sin foto</div>\'">'
    : '<div class="noimg">Sin foto cargada</div>';
  var dentro = img
    + '<span class="catlabel">'+esc(catLabel)+'</span>'
    + (fs.length && fs[0].o==='equipo' ? '<span class="subidapor">Foto del equipo</span>' : '')
    + (fs.length>1 ? '<span class="masfotos">🔍 '+fs.length+' fotos</span>'
       : fs.length ? '<span class="masfotos">🔍 Ver foto</span>' : '');
  if(!fs.length) return '<div class="ph">'+dentro+'</div>';
  var i=_galeria.length;
  _galeria.push({titulo:titulo, fotos:fs, id:id});
  return '<div class="ph phlink" role="button" tabindex="0" aria-label="Ver fotos de '+escAttr(alt)+'"'
       + ' onclick="abrirVisor(event,'+i+')"'
       + ' onkeydown="if(event.key===\'Enter\'||event.key===\' \')abrirVisor(event,'+i+')">'+dentro+'</div>';
}

var _verFotos=[], _verPos=0, _verId=null, _verTitulo='';

function abrirVisor(ev, i){
  if(ev){ ev.preventDefault(); ev.stopPropagation(); }
  var g=_galeria[i]; if(!g) return;
  _verFotos=g.fotos; _verPos=0; _verId=g.id; _verTitulo=g.titulo;
  document.getElementById('visorTit').textContent=g.titulo;
  pintarCarrete();
  document.getElementById('visor').classList.add('abierto');
  document.body.style.overflow='hidden';
  actualizarVisor();
}

function pintarCarrete(){
  var c=document.getElementById('carrete');
  c.innerHTML=_verFotos.map(function(f){
    return '<div class="slide"><img src="'+escAttr(f.u)+'" alt="'+escAttr(_verTitulo)+'"></div>';
  }).join('');
  c.scrollLeft=0;
}

// Refleja en el pie y el contador la foto que se está viendo.
function actualizarVisor(){
  var f=_verFotos[_verPos]; if(!f) return;
  document.getElementById('visorCont').textContent=(_verPos+1)+' / '+_verFotos.length;
  document.getElementById('visorPie').textContent = f.o==='drive' ? (f.n||'Drive') : f.o==='equipo' ? 'Foto del equipo' : 'pewenpisos.com.ar';
  document.getElementById('visorDesc').setAttribute('href', f.d);
  document.getElementById('visorPrev').disabled = _verPos===0;
  document.getElementById('visorNext').disabled = _verPos===_verFotos.length-1;
  // solo se puede sacar una foto que subió el equipo (no las del catálogo)
  document.getElementById('visorQuitar').classList.toggle('on', f.o==='equipo');
  // el botón de copiar vuelve a su estado normal al pasar a otra foto
  var bc=document.getElementById('visorCopiar');
  bc.textContent='📋 Copiar foto'; bc.disabled=false; bc.classList.remove('listo');
}

function irAFoto(n){
  var c=document.getElementById('carrete');
  n=Math.max(0, Math.min(n, _verFotos.length-1));
  c.scrollTo({left:n*c.clientWidth, behavior:'smooth'});
  _verPos=n; actualizarVisor();
}

function cerrarVisor(){
  document.getElementById('visor').classList.remove('abierto');
  document.body.style.overflow='';
}

// ====== COPIAR LA FOTO AL PORTAPAPELES ======
// Para copiar una imagen hay que poder leer sus bytes, y eso el navegador solo
// lo permite si el sitio de origen lo habilita. Las de Drive sí (por eso tienen
// su propia URL en `c`); las de pewenpisos.com.ar no, así que se piden al Apps
// Script, que las devuelve en base64 y hace de puente.
function blobDeFoto(f){
  if(f.c){
    return fetch(f.c).then(function(r){ return r.blob(); });
  }
  return fetch(getUrl()+'?img='+encodeURIComponent(f.u))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d.ok) throw new Error(d.error||'no se pudo leer la foto');
      var bin=atob(d.b64), arr=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
      return new Blob([arr], {type:d.tipo});
    });
}

// El portapapeles solo acepta PNG, y las fotos suelen ser JPG/WEBP: se redibujan.
function aPng(blob){
  if(blob.type==='image/png') return Promise.resolve(blob);
  return new Promise(function(ok,err){
    var url=URL.createObjectURL(blob), im=new Image();
    im.onload=function(){
      var c=document.createElement('canvas');
      c.width=im.naturalWidth; c.height=im.naturalHeight;
      c.getContext('2d').drawImage(im,0,0);
      URL.revokeObjectURL(url);
      c.toBlob(function(b){ b?ok(b):err(new Error('no se pudo convertir')); }, 'image/png');
    };
    im.onerror=function(){ URL.revokeObjectURL(url); err(new Error('no se pudo leer la imagen')); };
    im.src=url;
  });
}

function copiarFoto(btn){
  var f=_verFotos[_verPos]; if(!f) return;
  if(!navigator.clipboard || typeof ClipboardItem==='undefined'){
    alert('Este navegador no permite copiar imágenes. Usá Descargar.');
    return;
  }
  var t=btn.textContent;
  btn.disabled=true; btn.textContent='Copiando…';

  // Safari exige que el ClipboardItem se arme dentro del gesto del usuario, así
  // que se le pasa la promesa en vez de esperar a que termine.
  var promesa=blobDeFoto(f).then(aPng);
  var escribir = navigator.clipboard.write
    ? navigator.clipboard.write([new ClipboardItem({'image/png': promesa})])
    : Promise.reject(new Error('sin soporte'));

  escribir.then(function(){
    btn.textContent='✓ Copiada';
    btn.classList.add('listo');
    setTimeout(function(){ btn.textContent=t; btn.disabled=false; btn.classList.remove('listo'); },1800);
  }).catch(function(){
    // algunos navegadores no aceptan la promesa: reintento con el blob ya resuelto
    promesa.then(function(b){
      return navigator.clipboard.write([new ClipboardItem({'image/png': b})]);
    }).then(function(){
      btn.textContent='✓ Copiada'; btn.classList.add('listo');
      setTimeout(function(){ btn.textContent=t; btn.disabled=false; btn.classList.remove('listo'); },1800);
    }).catch(function(e){
      btn.textContent='No se pudo';
      setTimeout(function(){ btn.textContent=t; btn.disabled=false; },2200);
    });
  });
}

function waAccMsg(a){
  var l=[];
  l.push('*'+a.tono+'* — '+a.tipo);
  l.push('Disponible: '+accStock(a));
  if(a.link) l.push(a.link);
  l.push('Stock Córdoba');
  return l.join('\n');
}

// ====== SUBIR FOTO (cualquiera del equipo, desde el celu o la PC) ======
// Cada card tiene un botón: en el celu abre la cámara o la galería (elige el
// navegador), en la compu abre el explorador de archivos. Sin revisión previa:
// queda visible para todos apenas termina de subir.
var pendienteFoto = null;
function pedirFoto(btn){
  if(!getUrl()){ toast('Conectá el stock primero (ver arriba).'); return; }
  pendienteFoto = { id: btn.getAttribute('data-id'), nombre: btn.getAttribute('data-nombre'), btn: btn };
  document.getElementById('fotoInput').click();
}

// Achica la foto en el navegador antes de mandarla (una foto de celu pesa
// varios MB; así viaja rápido incluso con datos móviles).
function comprimirImagen(file){
  return new Promise(function(resolve, reject){
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function(){
      var MAX = 1600;
      var w = img.width, h = img.height;
      if(w > MAX || h > MAX){
        if(w > h){ h = Math.round(h * MAX / w); w = MAX; }
        else { w = Math.round(w * MAX / h); h = MAX; }
      }
      var canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      var dataUrl = canvas.toDataURL('image/jpeg', 0.82);
      resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
    };
    img.onerror = reject;
    img.src = url;
  });
}

function subirUnaFoto(destino, file){
  return comprimirImagen(file).then(function(img){
    return fetch(getUrl(), {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        id: destino.id,
        nombre: destino.nombre,
        imagenBase64: img.base64,
        mimeType: img.mimeType
      })
    });
  });
}

// Sube una o varias fotos de una, una por una (progreso claro — "2 de 5" — y
// no se satura el backend mandando todo junto).
function subirFoto(destino, files){
  var lista = Array.prototype.slice.call(files);
  if(!lista.length) return;
  var btn = destino.btn;
  if(btn) btn.disabled = true;
  var ok = 0, fallaron = 0;

  function siguiente(i){
    if(i >= lista.length){
      if(btn) btn.disabled = false;
      if(fallaron){
        toast(ok + ' foto' + (ok===1?'':'s') + ' subida' + (ok===1?'':'s') + ', ' + fallaron + ' no se pudo' + (fallaron===1?'':'ieron') + '.');
      } else {
        toast(ok > 1 ? '¡' + ok + ' fotos subidas! Ya las ve todo el equipo.' : '¡Foto subida! Ya la ve todo el equipo.');
      }
      setTimeout(function(){ cargar(true); }, 1500);
      return;
    }
    toast(lista.length > 1 ? 'Subiendo foto ' + (i+1) + ' de ' + lista.length + '…' : 'Subiendo foto…');
    subirUnaFoto(destino, lista[i])
      .then(function(){ ok++; siguiente(i+1); })
      .catch(function(){ fallaron++; siguiente(i+1); });
  }
  siguiente(0);
}

function copiar(btn){
  var msg=btn.getAttribute('data-msg');
  navigator.clipboard.writeText(msg).then(function(){
    btn.classList.add('done'); var t=btn.textContent; btn.textContent='✓ Copiado';
    setTimeout(function(){ btn.classList.remove('done'); btn.textContent=t; },1400);
  }).catch(function(){ prompt('Copiá el texto:', msg); });
}

function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(toast._h);
  toast._h = setTimeout(function(){ t.classList.remove('on'); }, 2200);
}

function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }
function escAttr(s){ return esc(s).replace(/"/g,'&quot;').replace(/\n/g,'&#10;'); }

init();
setInterval(setEstado, 60000);
